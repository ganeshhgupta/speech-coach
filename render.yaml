services:
  - type: web
    name: speech-coach
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free   # 512MB RAM: chosen to match the user's other Render services (all free tier).
                 # Confirmed live (2026-09-23) that running Whisper locally here OOM-crashes the
                 # instance, which is why transcription is offloaded to the HF Inference API below
                 # instead of raising the plan.
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false   # set in the Render dashboard, never committed. Primary grading path here:
                      # the Docker image doesn't bundle Node/the claude CLI, so CLAUDE_CODE_OAUTH_TOKEN
                      # (if also set) will fail over to this automatically — see answer_grading.py.
      - key: CLAUDE_CODE_OAUTH_TOKEN
        sync: false   # optional; only takes effect if you add Node + `claude` CLI to the Dockerfile
      - key: SC_CLAUDE_MODEL
        value: claude-sonnet-5
      - key: SC_TRANSCRIBE_BACKEND
        value: hf   # offload transcription to the HF Inference API instead of running Whisper locally — see pipeline/transcribe.py
      - key: HUGGINGFACE_TOKEN
        sync: false   # needs "Inference Providers" permission (not just read access) — see README
      - key: SC_HF_ASR_MODEL
        value: openai/whisper-large-v3
